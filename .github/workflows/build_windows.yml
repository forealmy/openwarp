name: Build OpenWarp for Windows (Debug)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        options:
          - oss
        default: oss

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  build:
    name: Build OpenWarp (Windows)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
          rustup target add x86_64-pc-windows-msvc

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@dc19f1e48450eefe5a29b8da6c6b00a87d730b37

      - name: Install cargo-bundle
        run: script/install_cargo_bundle
        shell: bash

      - name: Build Windows bundle (Verbose)
        run: |
          Write-Host "Starting build with verbose output..."
          $env:V = "s"
          script/bundle `
            --channel oss `
            --arch x86_64 `
            --nosign `
            --dmg-name-suffix x86_64
        shell: pwsh

      - name: Debug: Check Build Output
        run: |
          Write-Host "🔍 Checking target directory contents..."
          $targetDir = "target/x86_64-pc-windows-msvc/release-lto/bundle/windows"
          
          if (Test-Path $targetDir) {
            Write-Host "✅ Directory exists. Listing files:"
            Get-ChildItem -Path $targetDir -Recurse | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "❌ ERROR: Directory does not exist: $targetDir"
            exit 1
          }
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWarp-Windows-x86_64
          # 修复点：使用 '>' 符号将长路径折叠为一行，避免 YAML 语法错误
          path: >
            target/x86_64-pc-windows-msvc/release-lto/bundle/windows/**
          retention-days: 7
