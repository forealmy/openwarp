name: Build OpenWarp for Windows (Debug)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        options:
          - oss
        default: oss

env:
  CARGO_TERM_COLOR: always
  # 增加全局环境变量，确保 Rust 编译细节可见
  RUST_BACKTRACE: full

jobs:
  build:
    name: Build OpenWarp (Windows)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
          rustup target add x86_64-pc-windows-msvc

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@dc19f1e48450eefe5a29b8da6c6b00a87d730b37

      - name: Install cargo-bundle
        run: script/install_cargo_bundle
        shell: bash

      - name: Build Windows bundle (Verbose)
        # 关键修改：添加 V=s 以查看详细编译日志
        run: |
          # 尝试设置环境变量以启用详细输出
          $env:V = "s"
          script/bundle `
            --channel oss `
            --arch x86_64 `
            --nosign `
            --dmg-name-suffix x86_64
        shell: pwsh

      - name: Debug: List Build Output
        # 关键修改：在上传前强制检查目录内容
        run: |
          Write-Host "🔍 Checking target directory..."
          $targetDir = "target/x86_64-pc-windows-msvc/release-lto/bundle/windows"
          
          if (Test-Path $targetDir) {
            Write-Host "Directory exists. Contents:"
            Get-ChildItem -Path $targetDir -Recurse
          } else {
            Write-Host "❌ Directory does not exist: $targetDir"
            # 如果目录不存在，强制报错停止流程
            exit 1
          }
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWarp-Windows-x86_64
          # 使用通配符，防止文件名不匹配
          path: target/x86_64-pc-windows-msvc/release-lto/bundle/windows/**
          retention-days: 7
