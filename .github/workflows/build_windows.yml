name: Build OpenWarp for Windows (Debug)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        options:
          - oss
        default: oss

env:
  CARGO_TERM_COLOR: always
  # 开启 Rust 的详细日志，方便排查编译错误
  RUST_BACKTRACE: full

jobs:
  build:
    name: Build OpenWarp (Windows)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
          rustup target add x86_64-pc-windows-msvc

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@dc19f1e48450eefe5a29b8da6c6b00a87d730b37

      - name: Install cargo-bundle
        run: script/install_cargo_bundle
        shell: bash

      - name: Build Windows bundle (Verbose)
        # 关键：添加 V=s 环境变量，让 Cargo 输出详细的编译指令
        run: |
          Write-Host "Starting build with verbose output..."
          $env:V = "s"
          # 注意：如果你的 script/bundle 是纯 Shell 脚本，这里可能会因为换行符报错
          script/bundle `
            --channel oss `
            --arch x86_64 `
            --nosign `
            --dmg-name-suffix x86_64
        shell: pwsh

      - name: Debug: Check Build Output
        # 关键：在上传前强制检查目录是否存在以及里面有什么文件
        run: |
          Write-Host "🔍 Checking target directory contents..."
          $targetDir = "target/x86_64-pc-windows-msvc/release-lto/bundle/windows"
          
          if (Test-Path $targetDir) {
            Write-Host "✅ Directory exists. Listing files:"
            Get-ChildItem -Path $targetDir -Recurse | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "❌ ERROR: Directory does not exist: $targetDir"
            Write-Host "This means the build script failed or output to a different location."
            exit 1
          }
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWarp-Windows-x86_64
          # 使用通配符，确保能抓取到任何生成的文件
          path: target/x86_64-pc-windows-msvc/release-lto/bundle/windows/**
          retention-days: 7
