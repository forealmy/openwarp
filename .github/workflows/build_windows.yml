name: Build OpenWarp for Windows

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        options:
          - oss
        default: oss

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build OpenWarp (Windows)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
          rustup target add x86_64-pc-windows-msvc

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@dc19f1e48450eefe5a29b8da6c6b00a87d730b37

      - name: Install cargo-bundle
        run: script/install_cargo_bundle
        shell: bash

      - name: Build Windows bundle
        run: |
          script/bundle `
            --channel oss `
            --arch x86_64 `
            --nosign `
            --dmg-name-suffix x86_64
        shell: pwsh

      - name: Upload Artifact (Fixed)
        uses: actions/upload-artifact@v4
        with:
          name: OpenWarp-Windows-x86_64
          # 关键修复：上传整个 bundle 目录，而不是猜测具体的文件名
          path: target/x86_64-pc-windows-msvc/release-lto/bundle/windows/**
          retention-days: 7
